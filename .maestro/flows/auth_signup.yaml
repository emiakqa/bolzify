# ─────────────────────────────────────────────────────────────────────────────
# Regression: Sign-Up Flow → frisches Konto + Username-Set + Tab-Bar
#
# Seit dem UX-Refactor läuft Username NICHT mehr im Signup-Form, sondern auf
# dem dedizierten /set-username-Screen. Maestro klickt also durch zwei Screens:
#   1. /login (signup mode) — Mail + Passwort + AGB
#   2. /set-username — Username eintragen
#   3. Home
#
# Generiert pro Run einen unique Username + E-Mail mit Timestamp-Suffix —
# damit der Flow lokal mehrfach ohne Conflicts laufen kann.
#
# Erforderlich: In Supabase muss "Email-Confirmation" AUS sein (Dev-Modus),
# sonst landet der User nach Submit auf "Check dein Postfach" statt auf
# /set-username — und der Flow schlägt fehl.
#
# Dauer: ~20s.
# ─────────────────────────────────────────────────────────────────────────────
appId: de.bolzify.app
name: "Auth · Sign-Up (new account)"
tags:
  - regression
  - auth
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

- extendedWaitUntil:
    visible:
      text: "Willkommen zurück."
    timeout: 30000

# Auf Sign-Up umschalten
- tapOn:
    id: "login-switch-mode"

- assertVisible: "Konto anlegen."

# Unique-Suffix aus Timestamp (Sekunden) — kollisionsfrei pro Run
- evalScript: ${output.suffix = Math.floor(Date.now() / 1000)}

- tapOn:
    id: "login-email-input"
- inputText: "maestro_${output.suffix}@bolzify.test"

- tapOn:
    id: "login-password-input"
- inputText: "TestPass123!"

# AGB akzeptieren (CTA ist sonst disabled)
- tapOn:
    id: "login-terms-checkbox"

- tapOn:
    id: "login-submit-button"

# Auf /set-username gelandet — Username vergeben
- extendedWaitUntil:
    visible:
      text: "Wähl deinen Username."
    timeout: 15000

- tapOn:
    id: "set-username-input"
- inputText: "mae_${output.suffix}"

- tapOn:
    id: "set-username-submit"

# Erfolg = jetzt auf Home gelandet
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000
