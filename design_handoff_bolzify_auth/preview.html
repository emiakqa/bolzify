<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bolzify Auth Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #0F1212; color: #fff; font-family: 'Geist', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  .wrap { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .wrap > div { transform: scale(0.62); transform-origin: top center; height: 575px; width: 290px; }
  .lab { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: #7A8A86; text-transform: uppercase; text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="bolzplatz/tokens.jsx"></script>
<script type="text/babel" src="bolzplatz/primitives.jsx"></script>
<script type="text/babel" src="bolzplatz/screen-auth.jsx"></script>
<script type="text/babel" data-presets="react">
function Cell({ Comp, scheme, label }) {
  return (
    <div>
      <div className="lab">{label}</div>
      <window.IOSDevice width={402} height={874} dark={scheme === "dark"}>
        <Comp scheme={scheme} />
      </window.IOSDevice>
    </div>
  );
}
function App() {
  return (
    <div className="wrap">
      <Cell Comp={window.LoginScreen} scheme="light" label="Login · Light" />
      <Cell Comp={window.RegisterScreen} scheme="light" label="Registrierung · Light" />
      <Cell Comp={window.LoginScreen} scheme="dark" label="Login · Dark" />
      <Cell Comp={window.RegisterScreen} scheme="dark" label="Registrierung · Dark" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
